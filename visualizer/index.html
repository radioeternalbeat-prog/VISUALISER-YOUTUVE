<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Eternal Beat Medios — Visualizer Tacómetro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --papaya:#FF6A13;
    --papaya-bright:#FF8A3D;
    --steel:#C9CDD3;
    --steel-dim:#6E7278;
    --carbon:#0a0a0d;
    --carbon-2:#15151a;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--carbon);
    overflow:hidden;
    font-family:'Segoe UI', Arial, sans-serif;
  }
  #stage{
    position:relative;
    width:1920px;
    height:1080px;
    transform-origin: top left;
    background:var(--carbon);
  }
  #bgVideo, #bgImage{
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
    object-fit:cover;
    filter: brightness(0.55) saturate(1.2);
  }
  canvas#viz{
    position:absolute; top:0; left:0;
    width:1920px; height:1080px;
  }
  /* Carbon fiber frame border */
  .carbon-frame{
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    box-shadow: inset 0 0 0 18px var(--carbon-2), inset 0 0 0 22px var(--papaya);
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 6px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 6px);
    pointer-events:none;
    opacity:0.9;
  }
  #logoLabel{
    position:absolute;
    top:50%; left:50%;
    width:150px; height:150px;
    transform:translate(-50%,-50%) scale(1);
    pointer-events:none;
    z-index:5;
    filter: drop-shadow(0 0 18px rgba(255,106,19,0.55));
    transition: filter 0.1s ease-out;
    will-change: transform, filter;
  }
  #logoLabel img{
    display:block;
    width:100%; height:100%;
  }
  /* Fallback text logo (used only if assets/logo/logo.png fails to load) */
  #logoLabel .fallbackText{
    display:none;
    text-align:center;
    color:var(--steel);
    text-shadow: 0 0 18px rgba(201,205,211,0.9), 0 0 40px rgba(201,205,211,0.4);
    font-weight:800;
    letter-spacing:4px;
    font-size:34px;
  }
  #logoLabel .fallbackText small{
    display:block;
    color:var(--papaya-bright);
    font-size:16px;
    letter-spacing:6px;
    margin-top:6px;
    text-shadow:0 0 12px rgba(255,106,19,0.8);
  }
  #logoLabel img.broken{ display:none; }
  #logoLabel img.broken + .fallbackText{ display:block; }
  #controls{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(10,10,13,0.92);
    border-top:2px solid var(--papaya);
    padding:14px 20px;
    display:flex; align-items:center; gap:16px;
    z-index:50;
    color:#eee;
    font-size:14px;
  }
  #controls input[type="file"]{ color:#eee; }
  #controls button{
    background:var(--papaya);
    color:#111;
    border:none;
    padding:8px 16px;
    border-radius:4px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:1px;
  }
  #controls button:hover{ background:var(--papaya-bright); }
  #controls label{ color:var(--steel); font-weight:600; }
  #zoomWrap{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  a.hint{ color:#888; text-decoration:none; }
</style>
</head>
<body>

<div id="zoomWrap">
  <div id="stage">
    <video id="bgVideo" loop muted playsinline></video>
    <div class="carbon-frame"></div>
    <canvas id="viz" width="1920" height="1080"></canvas>
    <div id="logoLabel">
      <img id="logoImg" src="../assets/logo/logo.png" alt="Eternal Beat Medios"
           onerror="this.classList.add('broken')">
      <div class="fallbackText">ETERNAL BEAT<small>MEDIOS</small></div>
    </div>
  </div>
</div>

<div id="controls">
  <label>1. Audio (tu mezcla):</label>
  <input type="file" id="audioFile" accept="audio/*">
  <label>2. Fondo (video loop, opcional):</label>
  <input type="file" id="bgFile" accept="video/*">
  <button id="playBtn">▶ PLAY</button>
  <button id="fullscreenBtn">⛶ PANTALLA COMPLETA</button>
  <span class="hint">Tip: usá "PANTALLA COMPLETA" + grabador de pantalla (OBS) para exportar el video final.</span>
</div>

<script>
/* ============================================================
   ETERNAL BEAT MEDIOS - Visualizer Tacómetro Circular
   Estética: identidad real del canal (Negro Carbono / Naranja Papaya / Gris Acero)
   ============================================================ */

const audioFileInput = document.getElementById('audioFile');
const bgFileInput = document.getElementById('bgFile');
const playBtn = document.getElementById('playBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const bgVideo = document.getElementById('bgVideo');
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
const zoomWrap = document.getElementById('zoomWrap');
const logoLabelEl = document.getElementById('logoLabel');

let audioCtx, analyser, sourceNode, dataArray, bufferLength;
let audioEl = new Audio();
audioEl.crossOrigin = "anonymous";

// ---- Fit stage (1920x1080) into viewport ----
function fitStage(){
  const scale = Math.min(window.innerWidth / 1920, (window.innerHeight - 70) / 1080);
  stage.style.transform = `scale(${scale})`;
  zoomWrap.style.height = (1080*scale + 70) + 'px';
}
window.addEventListener('resize', fitStage);
fitStage();

// ---- Load user's audio file ----
audioFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  audioEl.src = url;
  setupAudioGraph();
});

// ---- Load user's background loop video ----
bgFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const url = URL.createObjectURL(file);
  bgVideo.src = url;
  bgVideo.play().catch(()=>{});
});

function setupAudioGraph(){
  if(audioCtx) return; // already set up, just reassign source below on play
}

playBtn.addEventListener('click', async () => {
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    sourceNode = audioCtx.createMediaElementSource(audioEl);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') await audioCtx.resume();

  if(audioEl.paused){
    audioEl.play();
    bgVideo.play().catch(()=>{});
    playBtn.textContent = '⏸ PAUSE';
    requestAnimationFrame(draw);
  } else {
    audioEl.pause();
    bgVideo.pause();
    playBtn.textContent = '▶ PLAY';
  }
});

fullscreenBtn.addEventListener('click', () => {
  if(zoomWrap.requestFullscreen) zoomWrap.requestFullscreen();
});

// ---- Colors ----
const PAPAYA = '#FF6A13';
const PAPAYA_BRIGHT = '#FF8A3D';
const STEEL = '#C9CDD3';
const CARBON = '#0a0a0d';

const CX = 960, CY = 540; // center of 1920x1080 canvas
const BASE_RADIUS = 220;
const MAX_RADIUS_EXTRA = 140;
const BAR_COUNT = 64;

let smoothLevels = new Array(BAR_COUNT).fill(0);
let bassSmooth = 0;
let pulse = 0;

function draw(){
  requestAnimationFrame(draw);
  ctx.clearRect(0,0,1920,1080);

  if(!analyser){ return; }
  analyser.getByteFrequencyData(dataArray);

  // Bass energy = average of first few bins (kick/bassline)
  let bassSum = 0;
  const bassBins = 6;
  for(let i=0;i<bassBins;i++) bassSum += dataArray[i];
  const bassLevel = (bassSum / bassBins) / 255; // 0..1
  bassSmooth += (bassLevel - bassSmooth) * 0.25;

  pulse += (bassLevel > 0.55 ? 1 : 0 - pulse*0.1);
  pulse *= 0.9;

  // ---- Outer glow ring reacts to bass (the "RPM zone") ----
  const rpmZoneActive = bassSmooth > 0.6;
  const glowRadius = BASE_RADIUS + bassSmooth * MAX_RADIUS_EXTRA;

  ctx.save();
  ctx.translate(CX, CY);

  // Background radial glow
  const grad = ctx.createRadialGradient(0,0, glowRadius*0.3, 0,0, glowRadius*1.6);
  grad.addColorStop(0, rpmZoneActive ? 'rgba(255,106,19,0.35)' : 'rgba(201,205,211,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0,0, glowRadius*1.6, 0, Math.PI*2);
  ctx.fill();

  // ---- Tachometer arc (RPM style: 270 degrees, from -225deg to 45deg) ----
  const startAngle = Math.PI * 0.75; // 135deg
  const endAngle = Math.PI * 2.75;   // 495deg -> wraps to give 270deg sweep
  const sweep = endAngle - startAngle;

  // Track background arc
  ctx.beginPath();
  ctx.arc(0,0, BASE_RADIUS, startAngle, endAngle);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 26;
  ctx.lineCap = 'round';
  ctx.stroke();

  // Active RPM arc based on overall energy
  let totalEnergy = 0;
  for(let i=0;i<bufferLength;i++) totalEnergy += dataArray[i];
  const avgEnergy = (totalEnergy / bufferLength) / 255;

  const activeSweep = sweep * Math.min(1, avgEnergy * 1.4 + bassSmooth*0.3);
  const arcGrad = ctx.createLinearGradient(-BASE_RADIUS, 0, BASE_RADIUS, 0);
  arcGrad.addColorStop(0, STEEL);
  arcGrad.addColorStop(0.7, PAPAYA);
  arcGrad.addColorStop(1, PAPAYA_BRIGHT);

  ctx.beginPath();
  ctx.arc(0,0, BASE_RADIUS, startAngle, startAngle + activeSweep);
  ctx.strokeStyle = arcGrad;
  ctx.lineWidth = 26;
  ctx.lineCap = 'round';
  ctx.shadowColor = rpmZoneActive ? PAPAYA : STEEL;
  ctx.shadowBlur = 30;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // "Redline" zone marks (last 15% of sweep)
  ctx.beginPath();
  ctx.arc(0,0, BASE_RADIUS, startAngle + sweep*0.85, endAngle);
  ctx.strokeStyle = 'rgba(255,40,20,0.55)';
  ctx.lineWidth = 8;
  ctx.stroke();

  // ---- Circular equalizer bars around the ring ----
  for(let i=0;i<BAR_COUNT;i++){
    const dataIndex = Math.floor((i / BAR_COUNT) * bufferLength * 0.5);
    const raw = dataArray[dataIndex] / 255;
    smoothLevels[i] += (raw - smoothLevels[i]) * 0.35;

    const angle = (i / BAR_COUNT) * Math.PI * 2 - Math.PI/2;
    const barLen = smoothLevels[i] * 90;
    const rInner = BASE_RADIUS + 40;
    const rOuter = rInner + barLen + 10;

    const x1 = Math.cos(angle) * rInner;
    const y1 = Math.sin(angle) * rInner;
    const x2 = Math.cos(angle) * rOuter;
    const y2 = Math.sin(angle) * rOuter;

    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.strokeStyle = smoothLevels[i] > 0.7 ? PAPAYA_BRIGHT : STEEL;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.globalAlpha = 0.85;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // ---- Needle (kick-reactive) ----
  const needleAngle = startAngle + sweep * Math.min(1, bassSmooth*1.3);
  ctx.save();
  ctx.rotate(needleAngle);
  ctx.beginPath();
  ctx.moveTo(-10,0);
  ctx.lineTo(BASE_RADIUS - 20, 0);
  ctx.lineTo(-10, 6);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 12;
  ctx.fill();
  ctx.restore();

  // Center hub
  ctx.beginPath();
  ctx.arc(0,0, 14, 0, Math.PI*2);
  ctx.fillStyle = CARBON;
  ctx.strokeStyle = PAPAYA;
  ctx.lineWidth = 3;
  ctx.fill();
  ctx.stroke();

  ctx.restore();

  // ---- Speed lines overlay (simple procedural, works without bg video) ----
  drawSpeedLines(avgEnergy);

  // ---- Logo pulse (vibra sutilmente con el bajo/kick) ----
  const logoScale = 1 + bassSmooth * 0.18 + (rpmZoneActive ? 0.05 : 0);
  const logoGlow = 12 + bassSmooth * 40;
  logoLabelEl.style.transform = `translate(-50%,-50%) scale(${logoScale.toFixed(3)})`;
  logoLabelEl.style.filter = `drop-shadow(0 0 ${logoGlow.toFixed(0)}px rgba(255,106,19,${(0.4 + bassSmooth*0.5).toFixed(2)}))`;
}

// Procedural speed-line streaks (used as fallback / overlay even with bg video)
let streaks = [];
for(let i=0;i<40;i++){
  streaks.push({
    x: Math.random()*1920,
    y: Math.random()*1080,
    len: 40+Math.random()*120,
    speed: 4+Math.random()*10,
    alpha: 0.05+Math.random()*0.15
  });
}
function drawSpeedLines(energy){
  ctx.save();
  for(const s of streaks){
    s.x -= s.speed * (1+energy*3);
    if(s.x < -s.len){ s.x = 1920 + s.len; s.y = Math.random()*1080; }
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.len, s.y);
    ctx.strokeStyle = `rgba(201,205,211,${s.alpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.restore();
}

// initial idle render loop (so canvas isn't blank before play)
function idleRender(){
  ctx.clearRect(0,0,1920,1080);
  drawSpeedLines(0.1);
  if(!audioCtx || audioEl.paused) requestAnimationFrame(idleRender);
}
idleRender();
</script>
</body>
</html>
